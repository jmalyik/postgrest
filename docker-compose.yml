version: "3.7"
services:
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.0.0
    environment:
      KEYCLOAK_ADMIN: kcadmin
      KEYCLOAK_ADMIN_PASSWORD: Miranda5
      KEYCLOAK_IMPORT: /realm-import/realm.json
    volumes:
      - ./keycloak/realm-import/realm.json:/opt/keycloak/data/import/realm.json:ro
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "sh", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 5s
      timeout: 5s
      retries: 20
  keycloak-init:
    container_name: keycloak-init
    image: quay.io/keycloak/keycloak:26.0.0
    depends_on:
      keycloak:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      echo "Logging in to Keycloak as $KEYCLOAK_ADMIN with password $KEYCLOAK_ADMIN_PASSWORD"
      /opt/keycloak/bin/kcadm.sh config credentials --server http://keycloak:8080 --realm master --user $KEYCLOAK_ADMIN --password $KEYCLOAK_ADMIN_PASSWORD
      # Disable required actions at realm level
      for action in UPDATE_PASSWORD UPDATE_PROFILE CONFIGURE_TOTP VERIFY_EMAIL TERMS_AND_CONDITIONS webauthn-register webauthn-register-passwordless; do
        /opt/keycloak/bin/kcadm.sh update authentication/required-actions/$action -r barrehackathlon -s "enabled=false"
      done
    environment:
      KEYCLOAK_ADMIN: kcadmin
      KEYCLOAK_ADMIN_PASSWORD: Miranda5
    networks:
      - default


  db:
    container_name: db
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: pocdb
    command: ["postgres", "-c", "listen_addresses=*"]
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgrest:
    container_name: postgrest
    image: postgrest/postgrest:latest
    environment:
      PGRST_DB_URI: postgres://admin:secret@db:5432/pocdb
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_SCHEMA: public
      PGRST_JWT_SECRET: http://keycloak:8080/realms/barrehackathlon/protocol/openid-connect/certs
      PGRST_JWT_CACHE_MAX_LIFETIME: 900
      PGRST_SERVER_HOST: 0.0.0.0
      PGRST_LOG_LEVEL: debug
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started

  redpanda:
    container_name: redpanda
    image: redpandadata/redpanda:latest
    command: redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M --node-id 0 --check=false --advertise-kafka-addr redpanda:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9644/v1/status/ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  debezium:
    container_name: debezium
    image: debezium/connect:2.5
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_config
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_statuses
    depends_on:
      redpanda:
        condition: service_healthy
      db:
        condition: service_started

  event-consumer:
    container_name: event-consumer
    build: ./event-consumer
    environment:
      KAFKA_BROKER: redpanda:9092
      TOPIC: dbserver1.public.items
    ports:
      - "4000:4000"
    depends_on:
      - redpanda

  test-runner:
    container_name: test-runner
    build: ./test-runner
    entrypoint: ["/usr/src/app/entrypoint.sh"]
    depends_on:
      - postgrest
      - keycloak
    volumes:
      - ./test-runner:/usr/src/app

networks:
  default:
    driver: bridge
