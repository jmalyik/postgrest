version: "3.7"
services:
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.0.0
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: kcadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: Miranda5
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KEYCLOAK_IMPORT: /realm-import/realm.json
    volumes:
      - ./keycloak/realm-import/realm.json:/opt/keycloak/data/import/realm.json:ro
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    ports:
      - "8080:8080"
# I needed to add a healthcheck to ensure the Keycloak service is ready before other services depend on it.
# keycloak does not have curl or wget installed, so we use a simple healthcheck command.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/realms/barrehackathlon/.well-known/openid-configuration"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - default
  keycloak-healthcheck:
    container_name: keycloak-healthcheck
    image: curlimages/curl:latest
    command: >
      sh -c '
        until curl -sf http://keycloak:8080/realms/barrehackathlon/.well-known/openid-configuration; do
          echo "Waiting for Keycloak realm...";
          sleep 2;
        done;
        echo "Keycloak realm is ready!";
        # Keep the container alive so healthcheck can run
        tail -f /dev/null
      '
    depends_on:
      - keycloak
    healthcheck:
      test: ["CMD", "curl", "-f", "http://keycloak:8080/realms/barrehackathlon/.well-known/openid-configuration"]
      interval: 5s
      timeout: 5s
      retries: 30
  keycloak-init:
    container_name: keycloak-init
    image: quay.io/keycloak/keycloak:26.0.0
    depends_on:
      keycloak-healthcheck:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: "/opt/keycloak/scripts/keycloak-init.sh"
    volumes:
      - ./keycloak/scripts/keycloak-init.sh:/opt/keycloak/scripts/keycloak-init.sh:ro
    environment:
      KEYCLOAK_ADMIN: kcadmin
      KEYCLOAK_ADMIN_PASSWORD: Miranda5
    networks:
      - default


  db:
    container_name: db
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: pocdb
    command: ["postgres", "-c", "listen_addresses=*"]
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgrest:
    container_name: postgrest
    image: postgrest/postgrest:latest
    environment:
      PGRST_DB_URI: postgres://admin:secret@db:5432/pocdb
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_SCHEMA: public
      PGRST_JWT_SECRET: http://keycloak:8080/realms/barrehackathlon/protocol/openid-connect/certs
      PGRST_JWT_AUD: postgrest
      PGRST_JWT_ROLE_CLAIM_KEY: ".realm_access.roles"
      PGRST_JWT_CACHE_MAX_LIFETIME: 900
      PGRST_SERVER_HOST: 0.0.0.0
      PGRST_LOG_LEVEL: debug
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      keycloak-healthcheck:
        condition: service_healthy

  redpanda:
    container_name: redpanda
    image: redpandadata/redpanda:latest
    command: redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M --node-id 0 --check=false --advertise-kafka-addr redpanda:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9644/v1/status/ready"]
      interval: 5s
      timeout: 5s
      retries: 30

  debezium:
    container_name: debezium
    image: debezium/connect:2.5
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_config
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_statuses
    depends_on:
      redpanda:
        condition: service_healthy
      db:
        condition: service_started

  event-consumer:
    container_name: event-consumer
    build: ./event-consumer
    environment:
      KAFKA_BROKER: redpanda:9092
      TOPIC: dbserver1.public.items
    ports:
      - "4000:4000"
    depends_on:
      - redpanda

  test-runner:
    container_name: test-runner
    build: ./test-runner
    entrypoint: ["/usr/src/app/entrypoint.sh"]
    depends_on:
      keycloak-healthcheck:
        condition: service_healthy
    volumes:
      - ./test-runner:/usr/src/app

networks:
  default:
    driver: bridge
